# module.yaml — what JaegerOS's discover_modules() reads to bind this
# module into the slot system.  One copy of every truth: nothing else in
# this repo restates what's declared here (CONVENTIONS.md law 1).

module: animation
slot: animation
version: 0.2.0

# The OWNERSHIP axis (TAXONOMY.md "Module KINDS") — orthogonal to
# `slot`, which says what ROLE this fills.
#
# `engine`, not `processing`. This module is software-only and touches
# no device, which is the PROCESSING description — but the taxonomy
# names animation explicitly under ENGINE ("fills a capability slot:
# tts, stt, animation"), and filling a slot is the distinguishing
# property. A processing module is a free-floating topic transform (a
# codec, a VAD) that no slot binds; this one IS the animation slot.
kind: engine

# /act/display/play — play an asset through an adapter. One command for
#                     both the face and arbitrary media: the adapter
#                     field (or the file extension) says which decoder,
#                     and the topic's instance segment says which
#                     display. There used to be a separate /act/media
#                     purely so a face renderer wouldn't be handed a
#                     movie; /act/display/face0/ vs /act/display/media0/
#                     does that now without a second message type.
# /act/display/stop — interrupt whatever is playing
consumes: [/act/display/play, /act/display/stop]

# Pixels ride their OWN topic, carrying pacing the decoder genuinely
# knows (duration_ms/is_final). Telemetry is separate again: monitoring
# whether a face is keeping up must not require subscribing to its full
# pixel stream — which at 4K would be ~1 GB/s.
produces:
  - /act/display/frame
  - /act/display/state
  - /act/display/stats

# Agentic I/O — the same capability shaped for a model, alongside the
# topics above which serve any consumer. Same two-surface pattern as
# kokoro_tts (text_to_speech) and whisper_stt (listen).
#
# These are the MECHANISM ("play this asset through this adapter"),
# deliberately persona-free. They are NOT set_avatar_state(emotion),
# which needs a character's emotion->asset table and therefore belongs
# to the consumer. Mechanism here, policy there.
tools: [play_animation, stop_animation, play_media]

factory: jaeger_animation:make_animation_node

# This module's group/key in the host's settings catalog — matches
# AnimationConfig in config.py. A manifest may still override geometry
# per [[node]], which is how one unit drives two displays at different
# sizes from one module.
config: animation

# Probed with importlib.util.find_spec before this module's slot is
# reported available.  Only TOP-LEVEL hard imports gate:
#   adapters/{image,gif,sprite}_adapter -> PIL
#   adapters/{bitmap,sprite,math}_adapter, procedural/gfx -> numpy
# video_adapter imports imageio + imageio_ffmpeg LAZILY inside its
# methods, so importing the package does not require them — deliberately
# excluded, matching the call kokoro_tts and whisper_stt made.
requires_libraries: [PIL, numpy]

# Adapter types this module can play. A character names one per asset;
# `mscript` is a SEQUENCE of the others rather than a format of its own.
#   image  bitmap  sprite  gif  video  math  mscript
